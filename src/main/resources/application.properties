# Loads the root .env when the back-end runs on the host (e.g. from IntelliJ).
spring.config.import=optional:file:.env[.properties]
spring.application.name=  ${NAME_BACKEND}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_USER_PASSWORD}
server.port=${PORT_BACKEND}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
# Which art source new boards are pulled from.
art.source=${ART_SOURCE:cma}
# Boards are drawn from a pool of stored artworks that this tops up in the background.
# A batch of 16 costs the Met ~21 requests; one batch a minute stays well inside its
# bot protection (~80 requests per couple of minutes).
art.pool.enabled=${ART_POOL_ENABLED:true}
art.pool.target-size=${ART_POOL_TARGET_SIZE:200}
art.pool.refill-delay=${ART_POOL_REFILL_DELAY:60s}
