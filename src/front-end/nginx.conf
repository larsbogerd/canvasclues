# Cache for proxied artwork images. Must live at http level, which is where
# conf.d/*.conf is included. Artic serves these with `max-age=2592000`, and the
# derivatives are immutable per (image_id, size), so a long TTL is safe.
proxy_cache_path /var/cache/nginx/artic
                 levels=1:2
                 keys_zone=artic:10m
                 max_size=1g
                 inactive=30d
                 use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Spring Boot backend (service name "backend" on the
    # compose network). Backend routes already start with /api/v1, so the path is
    # forwarded unchanged — no rewriting needed.
    location /api/ {
        proxy_pass http://backend:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Artwork images, served same-origin instead of hotlinked from the browser.
    #
    # Artic put their IIIF server behind Cloudflare, which now 403s ("Just a
    # moment...") every request that arrives without a Referer header. Browsers
    # drop that header on cross-origin image loads under a strict enough
    # Referrer-Policy, which is why the images died in the deployed stacks but
    # still worked against a local dev server. Fetching server-side and setting
    # the Referer ourselves takes the browser's policy out of the equation, and
    # the cache keeps us from re-pulling the same derivative on every game.
    location /iiif/ {
        proxy_pass https://www.artic.edu/iiif/;
        proxy_set_header Host    www.artic.edu;
        proxy_set_header Referer https://www.artic.edu/;
        proxy_set_header Cookie  "";

        # Needed for TLS to artic: without SNI the handshake gets the wrong cert.
        proxy_ssl_server_name on;
        proxy_ssl_protocols   TLSv1.2 TLSv1.3;

        proxy_cache            artic;
        proxy_cache_valid      200 30d;
        proxy_cache_valid      404 1m;
        proxy_cache_lock       on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale  error timeout updating http_403 http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;

        # Artic's own caching headers are correct; pass them to the browser.
        expires 30d;
    }

    # SPA fallback: let Vue Router handle deep links / page refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
