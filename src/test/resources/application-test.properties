# In-memory database so tests never touch the dev MySQL schema.
spring.datasource.url=jdbc:h2:mem:canvasclues;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.application.name=canvasclues-test
server.port=0
art.source=cma
